<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><title>Sample Test</title></head>
<body>
<div class="question-block">
  <p class="question">Q1. भारत की राजधानी क्या है?</p>
  <ul>
    <li>A) मुंबई</li>
    <li>B) नई दिल्ली</li>
    <li>C) कोलकाता</li>
    <li>D) चेन्नई</li>
  </ul>
  <p class="answer">Correct: B</p>
  <p class="explanation">नई दिल्ली भारत की राजधानी है।</p>
</div>
<div class="question-block">
  <p class="question">Q2. 5 गुना 5 कितना होता है?</p>
  <ul>
    <li>A) 10</li>
    <li>B) 20</li>
    <li>C) 25</li>
    <li>D) 30</li>
  </ul>
  <p class="answer">Correct: C</p>
  <p class="explanation">5 * 5 = 25 होता है।</p>
</div>
</body>
</html>
