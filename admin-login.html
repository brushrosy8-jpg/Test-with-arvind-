<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन लॉगिन - Test with Ankita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-6">
            <span class="text-4xl">🔐</span>
            <h1 class="text-2xl font-bold text-slate-800 mt-2">एडमिन पैनल लॉगिन</h1>
            <p class="text-sm text-slate-500">Test with Ankita प्रशासक पोर्टल</p>
        </div>
        <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">यूज़रनेम</label>
                <input type="text" id="username" required class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">पासवर्ड</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow transition">लॉगिन करें</button>
            <div id="error-msg" class="text-red-500 text-sm text-center font-medium hidden"></div>
        </form>
        <div class="mt-6 text-center">
            <a href="/" class="text-sm text-indigo-600 hover:underline">← मुख्य वेबसाइट पर वापस जाएं</a>
        </div>
    </div>
    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('error-msg');
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) window.location.href = '/admin.html';
                else { errDiv.textContent = data.error || 'लॉगिन असफल'; errDiv.classList.remove('hidden'); }
            } catch(err) { errDiv.textContent = 'कनेक्शन त्रुटि'; errDiv.classList.remove('hidden'); }
        }
    </script>
</body>
</html>
